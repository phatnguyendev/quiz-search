<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tra cứu câu hỏi trắc nghiệm</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8fafc;
    }

    .lock-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .lock-card {
      background: #fff;
      width: min(440px, 92%);
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .2);
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      input#searchBox {
        width: 100% !important;
        margin-left: 0 !important;
        margin-right: 0 !important;
        height: 56px !important;
      }

      #results {
        width: 100% !important;
        margin: 0 !important;
      }
    }
  </style>
</head>

<body>
  <div class="container py-4">
    <div id="roleBadge" class="mb-2"></div>

    <!-- Thanh thông tin + Đăng xuất -->
    <div id="authBar" class="d-flex justify-content-end align-items-center gap-2 mb-2" style="display:none;">
      <span id="authInfo" class="text-muted small"></span>
      <button id="btnLogout" class="btn btn-sm btn-outline-secondary">Đăng xuất</button>
      <button id="btnClearDev" class="btn btn-sm btn-outline-danger"
        title="Chỉ xóa deviceId trong trình duyệt này (không giải phóng trên server)">Xóa deviceId cục bộ</button>
    </div>

    <h2 class="text-center pb-3">Nhập từ khóa để tìm câu hỏi</h2>


    <div class="input-group mb-3">
      <input type="text" class="form-control" id="searchBox" placeholder="Nhập từ khóa..."
        style="width: 60%; margin-left: 20%; margin-right: 20%; height: 60px;" disabled>
    </div>

    
    <div id="results" style="width: 60%; margin-left: 20%; margin-right: 20%;"></div>

    <!-- ADMIN PANEL (ẩn, mở bằng ?admin=1) -->
    <div id="adminPanel" class="card mt-5 hidden">
      <div class="card-body">
        <h5 class="card-title">Bảng điều khiển Admin</h5>
        <div class="row g-2">
          <div class="col-md-4"><input id="adminKey" class="form-control" placeholder="Admin key"></div>
          <div class="col-md-4"><input id="resetSbd" class="form-control" placeholder="SBD cần reset"></div>
          <div class="col-md-2 d-grid"><button id="btnReset" class="btn btn-warning">Reset theo SBD</button></div>
          <div class="col-md-2 d-grid"><button id="btnList" class="btn btn-outline-primary">Danh sách</button></div>
        </div>
        <pre id="adminOut" class="mt-3 small"
          style="max-height:300px;overflow:auto;background:#0b1220;color:#e7edf7;padding:10px;border-radius:8px;"></pre>
      </div>
    </div>
  </div>

  <!-- OVERLAY ĐĂNG NHẬP -->
  <div id="lockOverlay" class="lock-overlay">
    <div class="lock-card">
      <h5 class="mb-3">Đăng nhập tra cứu</h5>
      <!-- <div class="mb-2">Chỉ tài khoản có trong danh sách Google Sheet mới truy cập được.
        Tài khoản thường chỉ dùng trên <strong>1 máy</strong>. Tài khoản <strong>SUPERADMIN</strong> dùng trên nhiều máy.</div> -->
      <div class="mb-3">
        <label class="form-label">Số báo danh (SBD)</label>
        <input id="sbdInput" type="text" class="form-control" placeholder="Nhập SBD...">
      </div>
      <div class="d-grid gap-2">
        <button id="btnLogin" class="btn btn-primary">Đăng nhập</button>
        <div id="loginMsg" class="text-danger small mt-2"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
